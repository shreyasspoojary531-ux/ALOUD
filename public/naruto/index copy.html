<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>naruto</title>

  <!-- Pinned versions + ?v= cache-bust: the PWA service worker serves cdn.jsdelivr.net
       cache-first forever, so an unpinned "latest" URL can get permanently poisoned with
       a stale/mismatched WASM+model set (no landmarks -> nothing renders or triggers).
       Pinning + query-busting forces fresh fetches and future-proofs updates. -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js?v=2" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js?v=2" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1675466124/drawing_utils.js?v=2" crossorigin="anonymous"></script>

  <style>
    body { margin: 0; overflow: hidden; background-color: black; }
    #v_src, #out {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      object-fit: cover; transform: scaleX(-1);
    }
    #out { z-index: 2; pointer-events: none; }
    .darkness {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(10, 5, 0, 0.3);
      mix-blend-mode: multiply; pointer-events: none; z-index: 5;
    }
    .fx {
      position: absolute; height: auto; top: 0; left: 0;
      transform: translate(-50%, -50%);
      pointer-events: none; display: none;
      mix-blend-mode: screen; z-index: 20;
    }
    #n { width: 1600px; }
    #s { width: 2400px; }
  </style>
</head>
<body>

  <video id="v_src" autoplay playsinline></video>
  <canvas id="out"></canvas>
  <div class="darkness"></div>

  <video id="n" class="fx" src="assets/naruto.mp4" autoplay loop playsinline></video>
  <video id="s" class="fx" src="assets/sasuke.mp4" autoplay loop playsinline></video>

  <div id="sound-hint" style="position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 30; background: rgba(0,0,0,0.75); color: #fff; padding: 10px 20px; border-radius: 20px; font-family: sans-serif; font-size: 14px; cursor: pointer; border: 1px solid rgba(255,255,255,0.2); pointer-events: auto;">
    🔊 Tap screen once to enable Jutsu audio
  </div>

  <div id="watchdog-hint" style="display: none; position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%); z-index: 30; background: rgba(120,0,0,0.85); color: #fff; padding: 10px 20px; border-radius: 20px; font-family: sans-serif; font-size: 14px; cursor: pointer; border: 1px solid rgba(255,255,255,0.2); pointer-events: auto;">
    ⚠️ Hand tracking failed to start — tap to reload
  </div>

  <script>
    const vElement = document.getElementById('v_src');
    const cElement = document.getElementById('out');
    const ctx = cElement.getContext('2d');
    const n = document.getElementById('n');
    const s = document.getElementById('s');
    const hint = document.getElementById('sound-hint');
    const watchdogHint = document.getElementById('watchdog-hint');

    let audioUnlocked = false;

    function unlockAudio() {
        if (audioUnlocked) return;
        audioUnlocked = true;
        if (hint) hint.style.display = 'none';

        [n, s].forEach(vid => {
            vid.muted = false;
            vid.volume = 1.0;
            const p = vid.play();
            if (p && p.then) {
                p.then(() => {
                    vid.pause();
                    vid.currentTime = 0;
                }).catch(() => {});
            }
        });
    }

    window.addEventListener('click', unlockAudio);
    window.addEventListener('pointerdown', unlockAudio);
    window.addEventListener('touchstart', unlockAudio);
    if (hint) hint.addEventListener('click', unlockAudio);

    // Watchdog: if the MediaPipe pipeline never produces results (e.g. a stale
    // service-worker cache entry broke WASM/model loading), offer a one-tap recovery.
    let gotAnyResults = false;
    setTimeout(() => {
        if (!gotAnyResults && watchdogHint) watchdogHint.style.display = 'block';
    }, 15000);
    if (watchdogHint) {
        watchdogHint.addEventListener('click', () => location.reload());
    }

    let pwr = [0, 0]; 
    let wasOpen = [false, false];

    function checkOpen(pts) {
        let count = 0;
        const wrist = pts[0];
        const tips = [8, 12, 16, 20];
        const pips = [6, 10, 14, 18];
        for (let i = 0; i < tips.length; i++) {
            const tip = pts[tips[i]];
            const pip = pts[pips[i]];
            if (Math.hypot(tip.x - wrist.x, tip.y - wrist.y) > Math.hypot(pip.x - wrist.x, pip.y - wrist.y)) count++;
        }
        return count >= 3;
    }

    function onResults(res) {
        gotAnyResults = true;
        if (watchdogHint) watchdogHint.style.display = 'none';

        cElement.width = vElement.videoWidth;
        cElement.height = vElement.videoHeight;
        ctx.save();
        ctx.clearRect(0, 0, cElement.width, cElement.height);

        let fL = false;
        let fR = false;

        n.style.display = 'none';
        s.style.display = 'none';

        if (res.multiHandLandmarks && res.multiHandedness) {
            res.multiHandLandmarks.forEach((pts, i) => {
                const label = res.multiHandedness[i].label;
                const isR = label === 'Right';
                const idx = isR ? 1 : 0;

                // --- BRIGHT BLUE SKELETON ---
                ctx.save();
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#00fbff';
                drawConnectors(ctx, pts, HAND_CONNECTIONS, {color: '#00d4ff', lineWidth: 3});
                drawLandmarks(ctx, pts, {color: '#ffffff', lineWidth: 1, radius: 2});
                ctx.restore();

                const open = checkOpen(pts);
                pwr[idx] += open ? 0.05 : -0.15;
                pwr[idx] = Math.max(0, Math.min(1, pwr[idx]));

                if (open && !wasOpen[idx]) {
                    const vid = isR ? s : n;
                    vid.muted = false;
                    vid.volume = 1.0;
                    vid.currentTime = 0;
                    vid.play().catch(() => {});
                }
                wasOpen[idx] = open;

                const wrist = pts[0];
                const knk = pts[9];

                if (pwr[idx] > 0.01) {
                    if (isR) { 
                        fR = true;
                        const tx = (wrist.x + knk.x) / 2;
                        const ty = (wrist.y + knk.y) / 2;
                        s.style.left = `${(1 - tx) * window.innerWidth}px`;
                        s.style.top = `${ty * window.innerHeight}px`;
                        s.style.display = 'block';
                        s.style.opacity = pwr[idx]; 
                    } else { 
                        fL = true;
                        const dx = knk.x - wrist.x;
                        const dy = knk.y - wrist.y;
                        const tx = knk.x + (dx * 0.8);
                        const ty = knk.y + (dy * 0.8);
                        n.style.left = `${(1 - tx) * window.innerWidth}px`;
                        n.style.top = `${(ty * window.innerHeight) - 120}px`;
                        n.style.display = 'block';
                        n.style.opacity = pwr[idx]; 
                    }
                }
            });
        }

        if (!fL) {
            pwr[0] = Math.max(0, pwr[0] - 0.15);
            if (pwr[0] > 0.01) { n.style.display = 'block'; n.style.opacity = pwr[0]; }
            wasOpen[0] = false;
        }
        if (!fR) {
            pwr[1] = Math.max(0, pwr[1] - 0.15);
            if (pwr[1] > 0.01) { s.style.display = 'block'; s.style.opacity = pwr[1]; }
            wasOpen[1] = false;
        }
        ctx.restore();
    }

    const h = new Hands({
        locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}?v=2`
    });

    h.setOptions({
        maxNumHands: 2,
        modelComplexity: 1,
        minDetectionConfidence: 0.65,
        minTrackingConfidence: 0.65
    });

    h.onResults(onResults);

    const cam = new Camera(vElement, {
        onFrame: async () => {
            try { await h.send({ image: vElement }); }
            catch (err) { console.error('[naruto] hands.send failed:', err); }
        },
        width: 1280, height: 720
    });
    cam.start();
  </script>
</body>
</html>
