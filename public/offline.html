<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aloud — Offline</title>
  <style>
    :root {
      --cream: #f7f1e6;
      --paper: #fffaf1;
      --ink: #28221b;
      --muted: #81776a;
      --orange: #cf5700;
      --line: #e5dccd;
      --alert: #f9d7cb;
      --alert-ink: #b83b00;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      background: var(--cream);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .topbar {
      position: absolute;
      top: 24px;
      left: 24px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: Georgia, serif;
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--ink);
    }

    .topbar-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--orange);
    }

    .card {
      background: var(--paper);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 14px 22px rgba(52, 40, 23, 0.13);
      border-top: 5px solid var(--orange);
      text-align: center;
    }

    .eyebrow {
      font-size: 0.75rem;
      font-weight: bold;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: 2.2rem;
      color: var(--orange);
      margin: 0 0 16px 0;
    }

    p {
      font-size: 1rem;
      line-height: 1.5;
      color: var(--ink);
      margin: 0 0 24px 0;
    }

    .notice {
      background: var(--alert);
      color: var(--alert-ink);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 24px;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px 24px;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      border: 2px solid transparent;
      transition: transform 150ms ease;
    }

    .btn:active { transform: scale(0.98); }

    .btn-primary {
      background: var(--orange);
      color: #ffffff;
    }

    .btn-secondary {
      background: transparent;
      border-color: var(--line);
      color: var(--ink);
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-dot"></div>
    Aloud.
  </div>

  <div class="card">
    <div class="eyebrow">NO INTERNET CONNECTION</div>
    <h1>You're Offline</h1>
    <p>Aloud's core eye-controlled communication features work offline. AI suggestions will resume automatically when your connection returns.</p>

    <div class="notice">
      📶 Reconnect to Wi-Fi or cellular data to resume online features.
    </div>

    <div class="actions">
      <button class="btn btn-primary" onclick="window.location.reload()">
        ↻ Try Reconnecting
      </button>
      <button class="btn btn-secondary" onclick="history.back()">
        ← Go Back
      </button>
    </div>
  </div>
</body>
</html>
